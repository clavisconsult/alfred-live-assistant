<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JARVIS HUD 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Load Three.js and Post-Processing libraries from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
<div id="loading" style="color: #00ffcc; font-family: monospace; position: absolute; top: 20px; left: 20px;">[SYSTEM]: Initializing Particle Core...</div>
<script>
    let scene, camera, renderer, composer;
    let particleSystem;
    let uniforms;
    let audioData = new Array(32).fill(0);
    let smoothedAudio = new Array(32).fill(0);
    let time = 0;

    function init() {
        scene = new THREE.Scene();
        // Removed fog for transparency

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0); // Transparent clear color
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Hide loading text
        document.getElementById('loading').style.display = 'none';

        // 1. Generate Particle Sphere (Sand-like)
        const particleCount = 35000; // Lessened from 60000
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const randoms = new Float32Array(particleCount);
        const baseRadius = 8.0;

        // Golden spiral method for even distribution on a sphere
        for (let i = 0; i < particleCount; i++) {
            const phi = Math.acos(-1 + (2 * i) / particleCount);
            const theta = Math.sqrt(particleCount * Math.PI) * phi;
            
            // Add a tiny bit of thickness to the sphere shell
            const r = baseRadius + (Math.random() * 0.4 - 0.2);

            positions[i * 3] = r * Math.cos(theta) * Math.sin(phi);
            positions[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
            positions[i * 3 + 2] = r * Math.cos(phi);
            
            randoms[i] = Math.random();
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

        // 2. Custom Shader Material for GPU Audio Reactivity
        uniforms = {
            uTime: { value: 0.0 },
            uAudio: { value: new Float32Array(32).fill(0) },
            uColor: { value: new THREE.Color(0x00ffcc) }
        };

        const vertexShader = `
            uniform float uTime;
            uniform float uAudio[32];
            attribute float aRandom;
            varying float vAudioReact;
            
            // Simple 3D noise function
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute(
                           i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                         + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                         + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }
            
            void main() {
                vec3 pos = position;
                float normalizedY = (pos.y + 8.0) / 16.0;
                int audioIndex = int(clamp(normalizedY * 32.0, 0.0, 31.0));
                
                float specificAudio = uAudio[audioIndex];
                float noiseVal = snoise(pos * 0.5 + uTime * 0.5);
                
                vec3 dir = normalize(pos);
                
                // Displacement
                float displacement = (specificAudio * 1.5) + (noiseVal * specificAudio * 2.0);
                displacement += snoise(pos * 0.2 - uTime * 0.2) * 0.5;
                
                pos += dir * displacement;
                vAudioReact = specificAudio + (noiseVal * 0.2);
                
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                
                // Make point sizes slightly larger to create a natural additive glow
                gl_PointSize = (4.0 + specificAudio * 3.0) * (20.0 / -mvPosition.z);
            }
        `;

        const fragmentShader = `
            uniform vec3 uColor;
            varying float vAudioReact;
            
            void main() {
                vec2 center = gl_PointCoord - vec2(0.5);
                float dist = length(center);
                if (dist > 0.5) discard;
                
                // Radial gradient for natural glowing bloom
                float intensity = pow(1.0 - (dist * 2.0), 1.5);
                
                vec3 finalColor = mix(uColor, vec3(1.0, 1.0, 1.0), vAudioReact * 0.6);
                
                gl_FragColor = vec4(finalColor * intensity, intensity * 0.7);
            }
        `;

        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        window.addEventListener('resize', onWindowResize, false);
        animate();
    }

    window.updateAudioData = function(fftArray) {
        audioData = fftArray;
    };

    window.setMuteState = function(isMuted) {
        if (isMuted) {
            // Change to a soft red/orange warning color when muted
            uniforms.uColor.value.setHex(0xff3333);
        } else {
            // Default cyan/teal color when listening
            uniforms.uColor.value.setHex(0x00ffcc);
        }
    };

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);

        time += 0.02;
        uniforms.uTime.value = time;

        let globalAvg = 0;
        let smoothArray = new Float32Array(32);
        
        for (let i = 0; i < 32; i++) {
            let target = audioData[i] || 0;
            if (target > smoothedAudio[i]) {
                smoothedAudio[i] += (target - smoothedAudio[i]) * 0.4;
            } else {
                smoothedAudio[i] += (target - smoothedAudio[i]) * 0.15;
            }
            smoothArray[i] = smoothedAudio[i];
            globalAvg += smoothedAudio[i];
        }
        globalAvg /= 32.0;

        smoothArray[0] = globalAvg;
        uniforms.uAudio.value = smoothArray;

        particleSystem.rotation.y += 0.002;
        particleSystem.rotation.x = Math.sin(time * 0.2) * 0.1;

        // Render scene directly (No EffectComposer) preserving perfect alpha transparency
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
